[project]
name = "agent-competitor"
version = "0.1.0"
description = "AI Research Agent using LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    
    # LLM Providers
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "google-generativeai>=0.3.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    
    # Tools & Utilities
    "tavily-python>=0.5.0",  # Search tool
    "duckduckgo-search>=6.0.0",  # Free search alternative
    
    # Core utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    
    # Async support
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",

    # JSON repair for LLM outputs
    "json-repair>=0.44.0",

    # PostgreSQL (async)
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Khai báo explicit các package nằm ở root project
packages = [
  "graph",
  "models",
  "schemas",
  "utils",
  "db",
  "jobs",
  "config",
  "extractors",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
